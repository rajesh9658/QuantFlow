name: quantflow

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-quantflow}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -h 127.0.0.1
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60 1"
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: quantflow:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-console}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./quantflow:/app/quantflow:ro
      - ./alembic.ini:/app/alembic.ini:ro
      - ./config:/app/config:ro
      - ./tests:/app/tests:ro
    tmpfs:
      - /app/.pytest_cache
      - /tmp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    command:
      - uvicorn
      - quantflow.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
        VITE_WS_URL: ws://localhost:8000/ws/dashboard
        VITE_APP_ENV: development
        VITE_AUTH_MODE: dev-bypass
    image: quantflow-frontend:local
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      BACKEND_UPSTREAM_URL: http://app:8000
    depends_on:
      app:
        condition: service_healthy

  # -----------------------------------------------------------------
  # Test runner — same image, separate database, activated via profile.
  #   docker compose --profile test run --rm test
  #   docker compose --profile test run --rm test pytest tests/unit
  # -----------------------------------------------------------------
  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: quantflow:local
    profiles: ["test"]
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: quantflow_test
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "1"
      APP_ENV: test
      LOG_LEVEL: WARNING
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./quantflow:/app/quantflow:ro
      - ./tests:/app/tests:ro
      - ./alembic.ini:/app/alembic.ini:ro
      - ./config:/app/config:ro
    tmpfs:
      - /app/.pytest_cache
      - /tmp
    command: ["pytest", "-xvs", "-p", "no:cacheprovider", "tests/"]

volumes:
  postgres_data:
  redis_data:
