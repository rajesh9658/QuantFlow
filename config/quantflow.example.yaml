# QuantFlow Example Configuration File

environment: "development"
log_level: "INFO"

event_bus:
  max_queue_size: 1000

database:
  host: "localhost"
  port: 5432
  name: "quantflow_db"
  user: "quantflow"

exchanges:
  - exchange_id: binance            # unique instance id (used in events, orders)
    type: binance                   # adapter implementation key
    enabled: true
    credentials_ref: "vault:secret/quantflow/binance"
    symbols:
      "BTC/USDT": "BTCUSDT"
      "ETH/USDT": "ETHUSDT"
      "SOL/USDT": "SOLUSDT"
    rate_limit_overrides:
      requests_per_second: 20
      websocket_streams: 200
    reconnect:
      max_retries: 10
      base_delay_seconds: 1.0
      max_delay_seconds: 60.0

  - exchange_id: bybit
    type: bybit
    enabled: true
    credentials_ref: "vault:secret/quantflow/bybit"
    symbols:
      "BTC/USDT": "BTCUSDT"
      "ETH/USDT": "ETHUSDT"
      "SOL/USDT": "SOLUSDT"
    rate_limit_overrides:
      requests_per_second: 10
      websocket_streams: 100
    reconnect:
      max_retries: 10
      base_delay_seconds: 1.0
      max_delay_seconds: 60.0

analytics:
  risk_free_rate: 0.0   # e.g., 0.025 for 2.5% per year
  annualization_factor: 252  # trading days per year
