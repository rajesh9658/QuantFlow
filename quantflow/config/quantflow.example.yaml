# QuantFlow Example Configuration File

environment: "development"
log_level: "INFO"

event_bus:
  max_queue_size: 1000

database:
  host: "localhost"
  port: 5432
  name: "quantflow_db"
  user: "quantflow"

market_data:
  exchange: "BINANCE"
  symbols:
    - "BTC-USD"
    - "ETH-USD"

analytics:
  risk_free_rate: 0.0   # e.g., 0.025 for 2.5% per year
  annualization_factor: 252  # trading days per year

