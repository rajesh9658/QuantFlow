name: CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quantflow_admin
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: quantflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Run Ruff Lint
        run: |
          uv run ruff check .

      - name: Run Mypy Typecheck
        run: |
          uv run mypy quantflow tests

      - name: Run Pytest Suite with Coverage
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: quantflow_test
          POSTGRES_USER: quantflow_admin
          POSTGRES_PASSWORD: password123
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          APP_ENV: test
        run: |
          uv run pytest -v --cov=quantflow --cov-report=term-missing

  frontend:
    name: Frontend Lint, Tests, Zero Hardcoded & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Vitest Suite
        run: npm run test

      - name: Production Bundle Build
        env:
          VITE_API_BASE_URL: https://quantflow.example.com
          VITE_WS_URL: wss://quantflow.example.com/ws/dashboard
          VITE_APP_ENV: production
          VITE_AUTH_MODE: jwt
        run: npm run build

      - name: Zero Hardcoded Values Enforcement
        working-directory: .
        run: python3 scripts/check_no_hardcoded.py

  docker-build:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: quantflow:ci-test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: false
          tags: quantflow-frontend:ci-test
          build-args: |
            VITE_API_BASE_URL=https://quantflow.example.com
            VITE_WS_URL=wss://quantflow.example.com/ws/dashboard
            VITE_APP_ENV=production
            VITE_AUTH_MODE=jwt
